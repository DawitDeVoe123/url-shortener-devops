# WireGuard Client Setup for URL Shortener
# Run this on Windows to connect to the VPN

# 1. Install WireGuard from: https://www.wireguard.com/install/

# 2. Create client config (replace with your server's IP)
@"
[Interface]
PrivateKey = <YOUR_CLIENT_PRIVATE_KEY>
Address = 10.8.0.2/24
DNS = 1.1.1.1

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = localhost:51820
AllowedIPs = 10.8.0.0/24, 172.19.0.0/16
PersistentKeepalive = 25
